name: Tests and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev pip-audit --progress-spinner off
      - run: uv run --locked --extra dev ruff check cognition scripts tests
      - name: Enforce staged style cleanup
        run: >-
          uv run --locked --extra dev ruff check cognition/artifact_validation.py cognition/capability.py
          cognition/improvement.py scripts/check_artifact.py scripts/host_probe.py
          scripts/prepare_local_marketplace.py --select E501,E701,E702
      - run: uv run --locked --extra dev mypy cognition
      - run: uv run --locked --extra dev pytest --collect-only -q
      - run: uv run --locked --extra dev coverage run -m pytest
      - run: uv run --locked --extra dev coverage report --fail-under=80
      - run: uv run --locked --extra dev coverage xml
      - run: uv run --locked --extra dev python scripts/validate_package.py
      - run: uv run --locked --extra dev python scripts/package_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.os }}
          path: dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build development image
        run: docker build -t cognition-os-smoke -f .devcontainer/Dockerfile .
      - name: Install and test in a fresh container
        run: >-
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace cognition-os-smoke
          sh -c 'uv sync --locked --extra dev && uv run --locked --extra dev coverage run -m pytest && uv run --locked --extra dev coverage report --fail-under=80'
