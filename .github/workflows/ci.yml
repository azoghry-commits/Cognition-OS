name: Tests and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev pip-audit --progress-spinner off
      - run: uv run --locked --extra dev ruff check cognition scripts tests
      - run: uv run --locked --extra dev mypy cognition
      - name: Run unit tests
        run: uv run --locked --extra dev python -m unittest discover -s tests -q
      - name: Collect test coverage
        run: uv run --locked --extra dev coverage run -m unittest discover -s tests -q
      - run: uv run --locked --extra dev coverage report --fail-under=80
      - run: uv run --locked --extra dev coverage xml
      - name: Measure generator coverage separately
        run: uv run --locked --extra dev coverage run --data-file=.coverage.generators --source=scripts -m unittest discover -s tests -p "test_build*.py" -q
      - name: Report generator coverage (informational)
        run: uv run --locked --extra dev coverage report --data-file=.coverage.generators --include="*/scripts/build_catalog.py,*/scripts/build_docs.py,*/scripts/build_hybrid.py" --fail-under=0
      - run: uv run --locked --extra dev python scripts/validate_package.py
      - run: uv run --locked --extra dev python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.os }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Dev Container image
        run: docker build -t cognition-os-smoke -f .devcontainer/Dockerfile .
      - name: Run README smoke in a clean container
        run: >-
          docker run --rm --volume "$PWD:/workspace" --workdir /workspace cognition-os-smoke
          sh -c 'uv sync --locked --extra dev && uv run --locked --extra dev coverage run -m unittest discover -s tests -q && uv run --locked --extra dev coverage report --fail-under=80'
