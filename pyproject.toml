[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cognition-os"
version = "0.5.0"
description = "Portable cognitive assistance for agent hosts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cognition OS project" }]
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema==4.26.0"]
dev = [
  "coverage[toml]==7.16.2",
  "jsonschema==4.26.0",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "ruff==0.14.2",
]

[tool.setuptools]
packages = ["cognition", "scripts"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["dist", "videos"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["cognition"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == ['\"]__main__['\"]:",
]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^scripts/cognition\\.py$"]
